<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>בעקבות האוצר</title>
    <!--
      GitHub Pages has no server-side rewrites, so a direct visit/refresh on
      a route like /terms returns this 404 page. This script re-encodes the
      path into a query string and redirects to index.html, which decodes it
      back (see the matching script in index.html) so React Router can take
      over. Based on the widely-used spa-github-pages pattern.

      pathSegmentsToKeep:
        - 0 for a custom domain or a github.io user/org page (default here)
        - 1 if deploying to a GitHub Pages *project* page, e.g.
          https://username.github.io/repo-name/  -> set this to 1
    -->
    <script>
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
