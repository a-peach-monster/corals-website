    <meta
      property="og:description"
      content="בעקבות האוצר היא תכנית רגשית לגני ילדים ולגיל הרך. ערכה חווייתית המקדמת למידה רגשית לגני ילדים, מפתחת חוסן רגשי, כישורים חברתיים ומסוגלות דרך הרפתקה."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <title>בעקבות האוצר | תכנית רגשית לגני ילדים ולמידה רגשית</title>
    <!-- Decodes the redirect produced by public/404.html on GitHub Pages so
         React Router receives the real path. No-op on hosts with proper
         SPA rewrites (Vercel/Netlify/Cloudflare Pages via vercel.json / _redirects). -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
